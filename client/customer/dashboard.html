<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aseel L'Atelier - Customer Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../shared/theme.css" rel="stylesheet">
</head>

<body>
  <div class="container py-4 py-md-5">

    <div class="hero mb-4">
      <div class="hero-inner">
        <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
          <div>
            <div class="brand">Aseel L'Atelier</div>
            <h1 class="hero-title mb-2">Customer Dashboard</h1>
            <p class="hero-sub mb-0">Your orders, measurements, appointments, and payments in one place.</p>
          </div>

          <button id="logoutBtn" class="btn btn-outline-secondary btn-soft">
            Logout
          </button>
        </div>
      </div>
    </div>

    <div id="dashboardContent">
      <div class="card card-luxe">
        <div class="card-body text-center small-muted">
          Loading your details...
        </div>
      </div>
    </div>

  </div>

  <script src="../shared/config.js"></script>
  <script src="dashboard.js"></script>
</body>

</html>
