<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Aseel L'Atelier - Seamstresses</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link href="../shared/theme.css" rel="stylesheet">

  <script src="../shared/config.js"></script>
  <script src="../shared/auth.js"></script>

  <script>
    requireAuth();
  </script>
</head>

<body>

  <div class="container py-4 py-md-5">

    <div id="sharedNav"></div>

    <div class="mb-4">

      <h1 class="hero-title mb-2">
        Seamstresses & Assignments
      </h1>

      <p class="hero-sub mb-0">
        Manage seamstresses, tailoring progress, and dress assignments.
      </p>

    </div>

    <div class="card card-luxe mb-4">

      <div class="card-body" id="orderSummary"></div>

    </div>

    <div class="card card-luxe mb-4">

      <div class="card-header">
        Seamstress
      </div>

      <div class="card-body">

        <form id="seamstressForm" class="row g-3">

          <input type="hidden" id="seamstress_id">

          <div class="col-md-6">

            <label class="label-soft">
              Name
            </label>

            <input
              id="name"
              class="form-control"
              placeholder="Name"
              required
            />

          </div>

          <div class="col-md-6">

            <label class="label-soft">
              Phone
            </label>

            <input
              id="phone"
              class="form-control"
              placeholder="Phone"
            />

          </div>

          <div class="col-md-6 d-grid">

            <button class="btn btn-primary">
              Save
            </button>

          </div>

          <div class="col-md-6 d-grid">

            <button
              type="button"
              id="cancelSeamstressEditBtn"
              class="btn btn-outline-secondary"
            >
              Cancel
            </button>

          </div>

        </form>

      </div>
    </div>

    <div class="card card-luxe mb-4">

      <div class="card-header">
        Assignment
      </div>

      <div class="card-body">

        <form id="assignmentForm" class="row g-3">

          <input type="hidden" id="assignment_id">

          <div class="col-md-6">

            <label class="label-soft">
              Order
            </label>

            <select
              id="order_id"
              class="form-select"
              required
            ></select>

          </div>

          <div class="col-md-6">

            <label class="label-soft">
              Seamstress
            </label>

            <select
              id="assigned_seamstress_id"
              class="form-select"
              required
            ></select>

          </div>

          <div class="col-md-4">

            <label class="label-soft">
              Task Type
            </label>

            <select
              id="task_type"
              class="form-select"
            >
              <option value="">Select task</option>

              <option>Special Tailoring</option>

              <option>Regular Tailoring</option>

              <option>Alteration</option>

              <option>Fitting Update</option>

              <option>Final Adjustment</option>

            </select>

          </div>

          <div class="col-md-4">

            <label class="label-soft">
              Status
            </label>

            <select
              id="assignment_status"
              class="form-select"
            >
              <option value="Pending">Pending</option>

              <option value="In Progress">
                In Progress
              </option>

              <option value="Ready For Fitting">
                Ready For Fitting
              </option>

              <option value="Completed">
                Completed
              </option>
            </select>

          </div>

          <div class="col-md-4">

            <label class="label-soft">
              Due Date
            </label>

            <input
              type="date"
              id="due_date"
              class="form-control"
            />

          </div>

          <div class="col-12">

            <label class="label-soft">
              Progress Notes
            </label>

            <textarea
              id="assignment_notes"
              class="form-control"
              rows="3"
              placeholder="Tailoring progress, fitting notes, fabric notes..."
            ></textarea>

          </div>

          <div class="col-md-6 d-grid">

            <button class="btn btn-primary">
              Save
            </button>

          </div>

          <div class="col-md-6 d-grid">

            <button
              type="button"
              id="cancelAssignmentEditBtn"
              class="btn btn-outline-secondary"
            >
              Cancel
            </button>

          </div>

        </form>

      </div>
    </div>

    <div class="card card-luxe">

      <div class="card-header d-flex justify-content-between">

        <span>
          Assignments
        </span>

        <span id="assignmentsCount">
          0
        </span>

      </div>

      <div class="card-body table-responsive">

        <table class="table align-middle">

          <thead>

            <tr>

              <th>#</th>

              <th>Order</th>

              <th>Customer</th>

              <th>Occasion</th>

              <th>Dress</th>

              <th>Seamstress</th>

              <th>Task</th>

              <th>Status</th>

              <th>Due Date</th>

              <th>Notes</th>

              <th>Actions</th>

            </tr>

          </thead>

          <tbody id="assignmentsTbody"></tbody>

        </table>

      </div>

    </div>

  </div>

  <script src="../shared/nav.js"></script>

  <script src="seamstresses.js"></script>

</body>

</html>
