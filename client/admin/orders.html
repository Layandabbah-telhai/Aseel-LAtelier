<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Aseel L'Atelier - Orders</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="../shared/theme.css" rel="stylesheet">

  <script src="../shared/config.js"></script>
  <script src="../shared/auth.js"></script>


</head>

<body>

  <div class="container py-4 py-md-5">

    <div id="sharedNav"></div>

    <div class="mb-4">
      <h1 class="hero-title mb-2">
        Orders
      </h1>

      <p class="hero-sub mb-0">
        Manage customer orders and related order data.
      </p>
    </div>

    <div class="card card-luxe mb-4">
      <div class="card-body">

        <div class="row g-3 align-items-end">

          <div class="col-md-6">
            <input id="searchInput" class="form-control" placeholder="Search orders..." />
          </div>

          <div class="col-md-3 d-grid">
            <button id="searchBtn" class="btn btn-primary">
              Search
            </button>
          </div>

          <div class="col-md-3 d-grid">
            <button id="resetBtn" class="btn btn-outline-secondary">
              Reset
            </button>
          </div>

        </div>

        <div class="mt-3 small-muted">
          API:
          <span id="apiUrlText"></span>
        </div>

      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-3">
      <h2 class="section-title mb-0">
        New / Edit Order
      </h2>

      <button id="toggleOrderFormBtn" class="btn btn-primary" type="button">
        + New Order
      </button>
    </div>

    <div id="orderFormPanel" style="display:none;">
      <div class="card card-luxe mb-4">

        <div class="card-header">
          Order Details
        </div>

        <div class="card-body">

          <form id="orderForm" class="row g-3">

            <input type="hidden" id="order_id" />

            <div class="col-md-6">
              <label class="label-soft">Customer</label>
              <select id="customer_id" class="form-select" required></select>
            </div>

            <div class="col-md-6">
              <label class="label-soft">Dress</label>
              <select id="dress_id" class="form-select" required></select>
            </div>

            <div class="col-md-4">
              <label class="label-soft">Order Type</label>
              <select id="order_type" class="form-select" required>
                <option value="" disabled selected>Select type</option>
                <option value="rental">Rental</option>
                <option value="sale">Sale</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="label-soft">Occasion</label>
              <select id="occasion_type" class="form-select">
                <option value="">Select occasion</option>
                <option value="Wedding">Wedding</option>
                <option value="Engagement Party">Engagement Party</option>
                <option value="Contract">Contract</option>
                <option value="Fatiha">Fatiha</option>
                <option value="Henna">Henna</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="label-soft">Customer Type</label>
              <select id="customer_type" class="form-select">
                <option value="">Select type</option>
                <option value="Bride">Bride</option>
                <option value="Bride / Groom Sister">Bride / Groom Sister</option>
                <option value="Bride / Groom Mother">Bride / Groom Mother</option>
                <option value="Bridesmaid">Bridesmaid</option>
                <option value="Friend">Friend</option>
                <option value="Guest">Guest</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="label-soft">Order Date</label>
              <input id="order_date" type="date" class="form-control" required />
            </div>

            <div class="col-md-4" id="returnDateWrap">
              <label class="label-soft">Return Date</label>
              <input id="return_date" type="date" class="form-control" />
            </div>

            <div class="col-md-4">
              <label class="label-soft">Total Price</label>
              <input id="total_price" type="number" step="0.01" min="0" class="form-control" placeholder="Total price"
                required />
            </div>

            <div class="col-md-6">
              <label class="label-soft">Venue City</label>
              <input id="venue_city" class="form-control" placeholder="Venue city" />
            </div>

            <div class="col-md-6">
              <label class="label-soft">Venue Hall</label>
              <input id="venue_hall" class="form-control" placeholder="Venue hall" />
            </div>

            <div class="col-md-4">
              <label class="label-soft">Previous Experience?</label>
              <select id="has_previous_experience" class="form-select">
                <option value="0">No</option>
                <option value="1">Yes</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="label-soft">Experience Type</label>
              <select id="previous_experience_type" class="form-select">
                <option value="">Select type</option>
                <option value="design">Design</option>
                <option value="rental">Rental</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="label-soft">Experience Rating</label>
              <select id="experience_rating" class="form-select">
                <option value="">Select rating</option>
                <option value="1">1 - Not Satisfied</option>
                <option value="2">2 - Fair</option>
                <option value="3">3 - Good</option>
                <option value="4">4 - Very Good</option>
                <option value="5">5 - Excellent</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="label-soft">Status</label>
              <select id="status" class="form-select">
                <option value="pending">Pending</option>
                <option value="in_progress">In Progress</option>
                <option value="sewing">Sewing</option>
                <option value="ready_for_fitting">Ready For Fitting</option>
                <option value="ready">Ready</option>
                <option value="delivered">Delivered</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>

            <div class="col-md-6 d-grid">
              <button class="btn btn-primary" type="submit">
                Save
              </button>
            </div>

            <div class="col-md-6 d-grid">
              <button type="button" id="cancelEditBtn" class="btn btn-outline-secondary">
                Cancel
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>

    <div class="card card-luxe">

      <div class="card-header d-flex justify-content-between">
        <span>Orders</span>
        <span id="ordersCount">0</span>
      </div>

      <div class="card-body table-responsive">

        <table class="table">
          <thead>
            <tr>
              <th>#</th>
              <th>Customer</th>
              <th>Dress</th>
              <th>Type</th>
              <th>Occasion</th>
              <th>Customer Type</th>
              <th>Total</th>
              <th>Status</th>
              <th style="width:320px;">Actions</th>
            </tr>
          </thead>

          <tbody id="ordersTbody"></tbody>
        </table>

      </div>
    </div>

  </div>

  <script src="../shared/nav.js"></script>
  <script src="orders.js"></script>

</body>

</html>
