<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aseel L'Atelier - Customer Requests</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../shared/theme.css" rel="stylesheet">

  <script src="../shared/config.js"></script>
  <script src="../shared/auth.js"></script>
  <script>
    requireAuth();
  </script>
</head>

<body>
  <div class="container py-4 py-md-5">

    <div id="sharedNav"></div>

    <div class="mb-4">
      <h1 class="hero-title mb-2">Customer Requests</h1>
      <p class="hero-sub mb-0">
        Review new occasion requests and appointment change requests.
      </p>
    </div>

    <div class="card card-luxe">
      <div class="card-header d-flex justify-content-between">
        <span>Pending Requests</span>
        <span id="requestsCount">0</span>
      </div>

      <div class="card-body table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>#</th>
              <th>Customer</th>
              <th>Request Type</th>
              <th>Date / Time</th>
              <th>Order Type</th>
              <th>Notes / Reason</th>
              <th>Status</th>
              <th style="width:260px;">Admin Action</th>
            </tr>
          </thead>

          <tbody id="requestsTbody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="../shared/nav.js"></script>
  <script src="occasion-requests.js"></script>
</body>

</html>
