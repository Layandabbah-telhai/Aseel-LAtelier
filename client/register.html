<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aseel L'Atelier - Register</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./shared/theme.css" rel="stylesheet">
</head>

<body>
  <div class="container py-5">

    <div class="card card-luxe mx-auto" style="max-width: 620px;">
      <div class="card-body">

        <div class="text-center mb-4">
          <img src="./shared/logo.png" alt="Aseel L'Atelier" class="logo-img mb-3" style="width:120px;">
          <div class="brand">Aseel L'Atelier</div>
          <h2 class="hero-title" style="font-size:2rem;">Create Account</h2>
          <p class="small-muted mb-0">Register as a customer.</p>
        </div>

        <form id="registerForm" class="row g-3">

          <div class="col-md-6">
            <label class="label-soft">First Name *</label>
            <input id="first_name" class="form-control" required />
          </div>

          <div class="col-md-6">
            <label class="label-soft">Last Name *</label>
            <input id="last_name" class="form-control" required />
          </div>

          <div class="col-md-6">
            <label class="label-soft">City</label>
            <input id="city" class="form-control" />
          </div>

          <div class="col-md-6">
            <label class="label-soft">Phone *</label>
            <input id="phone" class="form-control" required />
          </div>

          <div class="col-md-6">
            <label class="label-soft">Email *</label>
            <input id="email" type="email" class="form-control" required />
          </div>

          <div class="col-md-6">
            <label class="label-soft">Birth Date</label>
            <input id="birth_date" type="date" class="form-control" />
          </div>

          <div class="col-md-6">
            <label class="label-soft">Password *</label>
            <input id="password" type="password" class="form-control" required />
          </div>

          <div class="col-md-6">
            <label class="label-soft">Confirm Password *</label>
            <input id="confirm_password" type="password" class="form-control" required />
          </div>

          <div class="col-12">
            <label class="label-soft">How did you hear about us?</label>
            <select id="source_type" class="form-select">
              <option value="">Select</option>
              <option value="friend">Friend</option>
              <option value="instagram">Instagram</option>
              <option value="previous_experience">Previous Experience</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="col-12" id="sourceDetailsWrap" style="display:none;">
            <label class="label-soft">Other Details</label>
            <input id="source_details" class="form-control" placeholder="Write details..." />
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary w-100">
              Create Account
            </button>
          </div>

          <div class="col-12">
            <div id="registerError" class="text-danger text-center small"></div>
            <div id="registerSuccess" class="text-success text-center small"></div>
          </div>

          <div class="col-12 text-center">
            <span class="small-muted">Already have an account?</span>
            <a href="./login.html">Login</a>
          </div>

        </form>

      </div>
    </div>

  </div>

  <script src="./shared/config.js"></script>
  <script src="./register.js"></script>
</body>

</html>
