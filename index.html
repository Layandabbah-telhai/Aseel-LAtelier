<!doctype html>
<!-- Aseel L'Atelier website -->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aseel L'Atelier</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="client\shared\theme.css" rel="stylesheet">

  <style>
    body {
      background: #f8f5f3;
    }

    .gallery-logo {
      width: 140px;
      object-fit: contain;
    }

    .gallery-card img {
      height: 520px;
      object-fit: cover;
      background: #fff;
    }

    .gallery-title {
      font-family: Georgia, "Times New Roman", serif;
      color: #6e5d58;
      font-weight: 700;
    }

    .gallery-description {
      color: #9a8882;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .hero-center {
      text-align: center;
      padding: 2rem 1rem;
    }

    .gallery-slider {
      position: relative;
    }

    .slider-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.85);
      color: #5e4a45;
      font-size: 1.2rem;
      font-weight: bold;
      z-index: 5;
      cursor: pointer;
    }

    .slider-arrow-left {
      left: 12px;
    }

    .slider-arrow-right {
      right: 12px;
    }

    .slider-dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
    }

    .slider-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
    }

    .slider-dot.active {
      background: white;
    }
  </style>
</head>

<body>

  <div class="container py-4 py-md-5">

    <div class="hero mb-5">
      <div class="hero-inner">

        <div class="hero-center">

          <img src="client\shared\logo.png" alt="Aseel L'Atelier" class="gallery-logo mb-3">

          <div class="brand mb-2">
            Aseel L'Atelier
          </div>

          <h1 class="hero-title">
            Bridal Gallery
          </h1>

          <p class="hero-sub mb-4">
            Explore selected bridal designs from previous atelier work.
          </p>

          <a class="btn btn-primary px-4" href="./client/login.html">
            Login
          </a>

        </div>

      </div>
    </div>

    <div class="row g-4" id="galleryGrid">

      <div class="col-12">
        <div class="card card-luxe">
          <div class="card-body text-center small-muted">
            Loading gallery...
          </div>
        </div>
      </div>

    </div>

  </div>

  <script src="./client/shared/config.js"></script>

  <script>
    const API_BASE =
      window.CONFIG?.API_BASE ||
      "http://localhost:4000/api";

    const FALLBACK_IMAGE =
      "./client/shared/dark_logo.jpeg";

    const galleryGrid =
      document.getElementById("galleryGrid");

    async function loadGallery() {
      try {
        const res = await fetch(`${API_BASE}/dresses`);

        if (!res.ok) {
          throw new Error(`Failed to load gallery (${res.status})`);
        }

        const dresses = await res.json();

        const validDresses =
          Array.isArray(dresses)
            ? dresses.filter(hasValidImages)
            : [];

        if (!validDresses.length) {
          galleryGrid.innerHTML = `
          <div class="col-12">
            <div class="card card-luxe">
              <div class="card-body text-center small-muted">
                No gallery items available.
              </div>
            </div>
          </div>
        `;
          return;
        }

        galleryGrid.innerHTML =
          validDresses.map(renderGalleryCard).join("");

      } catch (error) {
        galleryGrid.innerHTML = `
        <div class="col-12">
          <div class="card card-luxe">
            <div class="card-body text-center text-danger">
              ${escapeHtml(error.message)}
            </div>
          </div>
        </div>
      `;
      }
    }

    function hasValidImages(dress) {
      const images =
        Array.isArray(dress.images) && dress.images.length
          ? dress.images.map(img => img.image_url).filter(Boolean)
          : dress.image_url
            ? [dress.image_url]
            : [];

      return images.some(isValidImage);
    }

    function isValidImage(path) {
      const lower = String(path || "").toLowerCase();

      return (
        lower &&
        !lower.includes(".pdf") &&
        !lower.includes(".doc") &&
        !lower.includes(".docx") &&
        !lower.includes(".txt")
      );
    }

    function renderGalleryCard(dress) {
      const images =
        Array.isArray(dress.images) && dress.images.length
          ? dress.images.map(img => img.image_url).filter(isValidImage)
          : dress.image_url && isValidImage(dress.image_url)
            ? [dress.image_url]
            : [FALLBACK_IMAGE];

      const escapedImages =
        images.map(img => escapeHtml(img));

      const imagesJson =
        escapeHtml(JSON.stringify(escapedImages));

      return `
      <div class="col-md-6 col-lg-4">
        <div class="card card-luxe gallery-card h-100 overflow-hidden">
          <div
            class="gallery-slider"
            data-images='${imagesJson}'
            data-index="0"
          >
            <img
              src="${escapedImages[0]}"
              class="img-fluid slider-main-image"
              alt="${escapeHtml(dress.dress_name || "Bridal Design")}"
              onerror="this.src='${FALLBACK_IMAGE}'"
            >

            ${escapedImages.length > 1
          ? `
                  <button
                    type="button"
                    class="slider-arrow slider-arrow-left"
                    onclick="changeSlide(this, -1)"
                  >
                    &#10094;
                  </button>

                  <button
                    type="button"
                    class="slider-arrow slider-arrow-right"
                    onclick="changeSlide(this, 1)"
                  >
                    &#10095;
                  </button>

                  <div class="slider-dots">
                    ${escapedImages.map((_, index) => `
                      <span class="slider-dot ${index === 0 ? "active" : ""}"></span>
                    `).join("")}
                  </div>
                `
          : ""
        }
          </div>

          <div class="card-body text-center">
            <h5 class="gallery-title mb-3">
              ${escapeHtml(dress.dress_name || "Bridal Design")}
            </h5>

            <p class="gallery-description mb-0">
              ${escapeHtml(
          dress.notes ||
          "A selected bridal piece from Aseel L'Atelier."
        )}
            </p>
          </div>
        </div>
      </div>
    `;
    }

    window.changeSlide = function (button, direction) {
      const slider = button.closest(".gallery-slider");
      if (!slider) return;

      const imageEl = slider.querySelector(".slider-main-image");
      const dots = slider.querySelectorAll(".slider-dot");
      const images = JSON.parse(slider.dataset.images || "[]");

      if (!images.length) return;

      let index = Number(slider.dataset.index || 0);
      index += direction;

      if (index < 0) index = images.length - 1;
      if (index >= images.length) index = 0;

      slider.dataset.index = index;
      imageEl.src = images[index] || FALLBACK_IMAGE;

      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === index);
      });
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadGallery();
  </script>

</body>

</html>
